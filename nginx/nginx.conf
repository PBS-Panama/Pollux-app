# ╔══════════════════════════════════════════════════════════════════╗
# ║  Leto Nginx Reverse Proxy                                       ║
# ╠══════════════════════════════════════════════════════════════════╣
# ║                                                                  ║
# ║  External Access: http://localhost:3000 (Docker maps 3000 -> 80) ║
# ║                                                                  ║
# ║  NOTE: All downstream ports (5173, 8000, 8080) are INTERNAL ONLY ║
# ║  and are securely isolated within the Docker network.            ║
# ║                                                                  ║
# ║  ROUTING:                                                        ║
# ║  /             → Leto Landing Page  (React/Vite, int. port 5173) ║
# ║  /api/         → Leto Backend       (FastAPI, internal port 8000) ║
# ║    /api/docs        → Swagger UI                                 ║
# ║    /api/redoc       → ReDoc                                      ║
# ║    /api/openapi.json → OpenAPI schema                            ║
# ║    /api/auth/*      → Auth endpoints (login, register, /me)     ║
# ║  /app/         → Leto Crewing App   (React/Express, int. port 8080) ║
# ║  /crewing-api/ → Leto Crewing API   (Express, internal port 8080) ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝

upstream leto_frontend {
    server frontend:5173;
}

upstream leto_backend {
    server backend:8000;
}

upstream leto_crewing {
    server crewing:8080;
}

server {
    listen 80;
    server_name localhost;

    # ── Max upload size (for document uploads) ──
    client_max_body_size 25M;

    # ── Leto Backend API (/api/) ──
    # Highest priority — must come before frontend catch-all
    location /api/ {
        proxy_pass http://leto_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Leto Crewing API (/crewing-api/) ──
    # Proxies to the Express API inside the Leto Crewing App container
    location /crewing-api/ {
        proxy_pass http://leto_crewing/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Leto Crewing App (/app/) ──
    # Serves the Leto Crewing App (React bundle via Express)
    location /app/ {
        proxy_pass http://leto_crewing/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rewrite redirects coming from crewing app
        proxy_redirect / /app/;
    }

    # ── Static downloads ──
    location = /downloads/leto_fleet_template.csv {
        alias /srv/downloads/leto_fleet_template.csv;
        types { }
        default_type text/csv;
        add_header Content-Disposition 'attachment; filename="leto_fleet_template.csv"';
    }

    # ── Leto Landing Page (catch-all) ──
    # Vite dev server with WebSocket support for HMR
    location / {
        proxy_pass http://leto_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}