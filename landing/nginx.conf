# Serves two independent builds from one root (2026-09-12 landing restoration):
#   - site/  → approved static marketing site (Appdent template), owns "/" and everything else.
#   - src/   → Vite/React SPA, built as app-shell.html, mounted only for the real auth routes.
# See landing/README.md and App.tsx's header comment for why "/" no longer goes through React.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Vite build output — hashed filenames, safe to cache long.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React SPA shell — only these paths ever need it; React Router takes over client-side.
    location = /login {
        try_files /app-shell.html =404;
    }

    location = /register {
        try_files /app-shell.html =404;
    }

    location = /forgot-password {
        try_files /app-shell.html =404;
    }

    location = /reset-password {
        try_files /app-shell.html =404;
    }

    location /dashboard {
        try_files /app-shell.html =404;
    }

    # Approved static marketing site — everything else.
    location / {
        try_files $uri $uri/ =404;
    }
}
