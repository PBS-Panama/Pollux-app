# ============================================================================
# pb-pollux — Cloud Run env vars · PLANTILLA (sin valores reales)
# ============================================================================
# Uso:
#   cp infra/cloudrun/pb-pollux.env.example.yaml  <carpeta FUERA del repo>/pb-pollux.env.yaml
#   … rellenar …
#   gcloud run deploy pb-pollux --env-vars-file=<ruta>/pb-pollux.env.yaml …
#
# ⚠️ --env-vars-file REEMPLAZA el set completo de variables del servicio: este
#    archivo debe traer TODAS, no solo la que cambia.
# ⚠️ Nunca --set-env-vars con DATABASE_URL: el delimitador choca con la "@"
#    y la URL se trunca en silencio (incidente 2026-09-02).
# ⚠️ Nunca commitear el archivo rellenado. Valores reales: backup fuera del repo
#    (…/00 Dominius/pb-leto-config-backup-2026-09-02.yaml) + memoria prod_credentials_pollux.
# ============================================================================

# ── Base de datos (Cloud SQL durable-sky-484422-b5:us-central1:leto-postgres, db leto_db,
#    compartida con Cástor; nombre histórico a propósito — registro de nombres en CLAUDE.md) ──
DATABASE_URL: "postgresql://<user>:<password>@/leto_db?host=/cloudsql/durable-sky-484422-b5:us-central1:leto-postgres"

# ── Auth / JWT ──
SECRET_KEY: "<64+ chars aleatorios — el validador rechaza < 32>"
ALGORITHM: "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES: "480"
REFRESH_TOKEN_EXPIRE_DAYS: "7"

# ── Entorno (activa el fail-fast de config.py) ──
ENVIRONMENT: "production"

# ── CORS — orígenes públicos, separados por coma. Añadir el dominio al mapearlo ──
CORS_ORIGINS: "https://pollux-app.com,https://www.pollux-app.com,https://pb-pollux-mlb5b3vcjq-uc.a.run.app"

# ── Castor (seafarer file storage + admin's cross-app calls; 2026-09-10) ──
# ⚠️ Castor NO tiene Cloud Run desplegado todavía (ver Handover de Castor,
#    "gate de Rick pendiente") — este valor no hace nada útil hasta que exista
#    un pb-castor real. Cuando se despliegue, apuntar aquí a su URL pública
#    (dominio o el run.app), nunca a un hostname interno de docker-compose.
CASTOR_BASE_URL: "https://www.castor-app.com"

# ── Seeds (producción: sin demo ni admin salvo que se pida explícitamente) ──
SEED_DEMO_DATA: "false"
# ADMIN_SEED_PASSWORD: "<solo la primera vez, para crear el admin; luego quitarla>"

# ── OCR / IA (opcionales; sin clave → MockOcrProvider) ──
GOOGLE_VISION_API_KEY: ""
ANTHROPIC_API_KEY: ""

# ── Storage legacy (no los lee nadie hoy — ver Handover "P2 · env vars") ──
STORAGE_BUCKET: ""
AWS_ACCESS_KEY_ID: ""
AWS_SECRET_ACCESS_KEY: ""
AWS_REGION: ""
