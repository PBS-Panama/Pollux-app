# ============================================================================
# pbsds-pollux-app — nginx Cloud Run (single-container monolith)
# ============================================================================
# POLLUX ONLY (physical split 2026-09-03 — Castor lives in its own folder).
# Upstreams are localhost (supervisord manages all processes):
#   backend :8000 — FastAPI
#   leto    :8081 — Company crewing SPA (brand: Pollux; folder name is historic)
# Static files:
#   /var/www/landing/ — Landing + auth (base: /)
#   /var/www/admin/   — Admin panel  (base: /admin/)
#
# Domain: pollux-app.com (apex) + www → 301 apex. Cloud Run terminates TLS,
# so inside the container everything is plain HTTP on :80 — never redirect
# based on $scheme, only on $host.
# ============================================================================

# ── Real client IP for the backend's rate limiter ──────────────────────────
# Cloud Run's edge APPENDS the caller's IP to any X-Forwarded-For the caller
# sent, so only the LAST entry is trustworthy. $remote_addr here is Google's
# proxy (same for every visitor), so it is only the fallback. The backend
# (core/rate_limit.py) also reads the last entry.
map $http_x_forwarded_for $real_client_ip {
        ~([^,\s]+)\s*$  $1;
        default          $remote_addr;
}

# ── www.pollux-app.com → pollux-app.com (canonical host) ──────────────────
server {
        listen 80;
        server_name www.pollux-app.com;
        return 301 https://pollux-app.com$request_uri;
}

server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 25M;

        # Redirects below must stay relative: Cloud Run terminates TLS, so an
        # absolute Location built here would say http:// and port 80.
        absolute_redirect off;

        # ── Compression (text assets only; images/fonts are pre-compressed) ──
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/plain text/css application/json application/javascript
                   text/javascript application/xml image/svg+xml;

        # ── Security headers (inherited by every location below that does
        #    not declare its own add_header — keep locations add_header-free
        #    and use `expires` for caching so inheritance is preserved) ──────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        # CSP (2026-10-04, T15). No inline <script> exists in landing/site, the
        # landing SPA, admin or the company bundle, so script-src stays strict.
        # style-src needs 'unsafe-inline' (React style props + Tailwind) and
        # Google Fonts; img-src allows data:/blob: (avatars, previews).
        # connect-src 'self': every API call goes through this same origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; frame-src 'self' blob: https://www.youtube.com https://player.vimeo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        # ── /api/* → FastAPI backend ─────────────────────────────────────
        location /api/ {
            proxy_pass             http://127.0.0.1:8000/api/;
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $real_client_ip;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_buffer_size      256k;
            proxy_buffers          8 512k;
            proxy_busy_buffers_size 512k;
            proxy_read_timeout     120s;
        }

        # ── Kill leto's old Workbox service worker (same as nginx.conf) ──
        # A browser that visited /company/ before SERVICE_WORKER_DISABLED got
        # stuck on a cached old build. Serve a no-op SW that unregisters itself
        # and reloads open tabs. default_type + expires (not add_header) so the
        # security headers above are still inherited.
        location ~ ^(/company)?/service-worker\.js$ {
            default_type application/javascript;
            expires -1;
            return 200 "self.addEventListener('install',()=>self.skipWaiting());\nself.addEventListener('activate',(event)=>{event.waitUntil(self.registration.unregister().then(()=>self.clients.matchAll()).then((clients)=>clients.forEach((client)=>client.navigate(client.url))));});\n";
        }

        # ── /company/* → Company SPA (brand: Pollux) ─────────────────────
        location /company/ {
            proxy_pass         http://127.0.0.1:8081/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # ── /admin/* → Admin static (base=/admin/) ───────────────────────
        # With `alias`, the try_files fallback must be a URI (re-enters this
        # location), not a filesystem path.
        location /admin/ {
            alias /var/www/admin/;
            try_files $uri $uri/ /admin/index.html;
        }

        # The login sends an admin to the bare `/admin` (landing's
        # destinationFor). nginx only adds the trailing slash by itself for
        # proxied locations, not for an `alias` one — so without this, `/admin`
        # fell through to `location /` and 404'd (found in production
        # 2026-10-02; the local nginx.conf proxies /admin/, so it never showed).
        location = /admin {
            return 301 /admin/;
        }

        # ── /health → FastAPI health check ───────────────────────────────
        location = /health {
            proxy_pass http://127.0.0.1:8000/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── /ready → readiness (DB + schema at Alembic head), 503 if not ──
        location = /ready {
            proxy_pass http://127.0.0.1:8000/ready;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── Landing: hashed Vite assets → cache 1 year ───────────────────
        # `^~` = prefix match wins over regex; anchored at the root so it never
        # captures /admin/assets/ or /company/assets/.
        location ^~ /assets/ {
            root /var/www/landing;
            expires 1y;
            access_log off;
        }

        # ── Landing: React SPA shell (real auth pages) — only these paths
        #    ever need it; React Router takes over client-side from there.
        #    Ported from landing/nginx.conf (the standalone local build) —
        #    see Dockerfile.prod's Static files section for why app-shell.html
        #    exists (2026-09-14, Handover.md nota (48), A-2). ─────────────────
        location = /login {
            root /var/www/landing;
            try_files /app-shell.html =404;
        }

        location = /register {
            root /var/www/landing;
            try_files /app-shell.html =404;
        }

        # 2026-09-15 (Handover.md nota (58)) — password reset request/completion.
        location = /forgot-password {
            root /var/www/landing;
            try_files /app-shell.html =404;
        }

        location = /reset-password {
            root /var/www/landing;
            try_files /app-shell.html =404;
        }

        location /dashboard {
            root /var/www/landing;
            try_files /app-shell.html =404;
        }

        # ── Landing: site entry — never cache (every deploy must be visible) ─
        location = /index.html {
            root /var/www/landing;
            expires -1;
        }

        # ── / → approved static marketing site (landing/site/), everything
        #    else. No SPA fallback here on purpose — this is a static site,
        #    not a client-routed app; a real 404 is correct for a bad path. ──
        location / {
            root /var/www/landing;
            try_files $uri $uri/ =404;
            expires 1h;
        }
}
