events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ── Upstream services ──────────────────────────────────────────────
    # POLLUX ONLY (physical split 2026-09-03 — Castor has its own folder).
    #   leto = Company-facing app (brand: Pollux; historic name kept)
    upstream landing  { server landing:80; }
    upstream leto     { server leto:8080; }
    upstream admin    { server admin:80; }
    upstream backend  { server backend:8000; }

    server {
        listen 80;
        # A bare path like `/admin` (no trailing slash) doesn't match the
        # `location /admin/` prefix below, so nginx falls back to its own
        # implicit trailing-slash normalization for that location — and by
        # default builds an ABSOLUTE Location header from this container's
        # own host:port (localhost:80), not the external port (4001 locally,
        # 443 in prod) this proxy is actually reached on. Browsers/clients
        # following that redirect get connection-refused. Same fix as
        # landing/Dockerfile's inner nginx.
        absolute_redirect off;

        client_max_body_size 25M;

        # ── /api/* → FastAPI backend ───────────────────────────────────
        location /api/ {
            proxy_pass             http://backend;
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            # Large base64 image payloads need bigger buffers
            proxy_buffer_size      256k;
            proxy_buffers          8 512k;
            proxy_busy_buffers_size 512k;
            proxy_read_timeout     120s;
        }

        # ── Kill leto's own (real, Workbox-generated) service worker ──
        # 2026-09-12: this SW is what actually caused the "profile menu's
        # login link still goes to the old version" bug reported after the
        # 2026-09-10 fix — confirmed the fix WAS live server-side (fresh
        # Chrome profile got the correct href), so a browser that had
        # visited /company/ before was stuck on a cached old build via this
        # SW despite skipWaiting/clientsClaim. Root cause fixed in
        # webpack.config.js (SERVICE_WORKER_DISABLED: true — no more new
        # registrations), this cleans up browsers that already have the old
        # one: unregister + force every open tab to reload, so it's gone
        # for good instead of just neutered.
        location = /company/service-worker.js {
            add_header Content-Type "application/javascript" always;
            add_header Cache-Control "no-store, no-cache" always;
            return 200 "self.addEventListener('install',()=>self.skipWaiting());\nself.addEventListener('activate',(event)=>{event.waitUntil(self.registration.unregister().then(()=>self.clients.matchAll()).then((clients)=>clients.forEach((client)=>client.navigate(client.url))));});\n";
        }

        # ── /company/* → Leto (Company-facing crewing interface) ──────
        # URL kept as /company/ for backward compat; brand is "Pollux"
        location /company/ {
            proxy_pass         http://leto/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── /admin/* → Admin interface (auto-auth, no guard) ──────────
        location /admin/ {
            proxy_pass         http://admin/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Kill any stale root-scoped service worker ─────────────────
        # The current landing app registers no SW at all, but an OLDER
        # version of it may have (browsers cache SW registrations
        # indefinitely) — anyone who ever visited "/" before the Appdent
        # rebuild can still be served that build's cached shell forever,
        # e.g. clicking the "Pollux" logo (href="/") landing on an old
        # version. Same fix already applied on Castor's /app/ scope:
        # serve a no-op SW at the same URL so the browser's next update
        # check replaces the old one and stops intercepting requests.
        location = /service-worker.js {
            add_header Content-Type "application/javascript" always;
            add_header Cache-Control "no-store, no-cache" always;
            return 200 "self.addEventListener('install',()=>self.skipWaiting());\nself.addEventListener('activate',(event)=>{event.waitUntil(self.registration.unregister().then(()=>self.clients.matchAll()).then((clients)=>clients.forEach((client)=>client.navigate(client.url))));});\n";
        }

        # ── / → Landing page (catch-all last) ─────────────────────────
        location / {
            proxy_pass         http://landing;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_intercept_errors on;
            error_page 404 = @landing_spa;
        }

        location @landing_spa {
            proxy_pass http://landing;
        }
    }
}
