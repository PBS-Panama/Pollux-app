# ╔══════════════════════════════════════════════════════════════════╗
# ║  Leto Nginx — Integrated mode (main docker-compose.yml)         ║
# ╠══════════════════════════════════════════════════════════════════╣
# ║                                                                  ║
# ║  This config is used when the IDM services run inside the        ║
# ║  root pb-website docker-compose.yml (services prefixed leto-).  ║
# ║  For standalone IDM use, nginx/nginx.conf is used instead.      ║
# ║                                                                  ║
# ║  Service name mapping (standalone → integrated):                 ║
# ║    frontend  → leto-frontend  (Vite, int. port 5173)            ║
# ║    backend   → leto-backend   (FastAPI, int. port 8000)         ║
# ║    crewing   → leto-crewing   (Express, int. port 8080)         ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝

upstream leto_frontend {
    server leto-frontend:5173;
}

upstream leto_backend {
    server leto-backend:8000;
}

upstream leto_crewing {
    server leto-crewing:8080;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://leto_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /crewing-api/ {
        proxy_pass http://leto_crewing/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        proxy_pass http://leto_crewing/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /app/;
    }

    location / {
        proxy_pass http://leto_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
