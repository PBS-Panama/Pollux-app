# Pollux — build en Cloud Build (no requiere Docker local).
#
#   gcloud builds submit --config cloudbuild.yaml --project pollux-app-507503 --substitutions=SHORT_SHA=<sha>
#
# `gcloud auth login` se corre desde la terminal integrada de VS Code — el flujo
# OAuth necesita el redirect del browser (regla del CLAUDE.md de la raíz).
#
# Sirve para dos cosas a la vez: prueba que el Dockerfile.prod construye de verdad
# y deja la imagen lista para desplegar pb-pollux. El registry pollux-registry en
# pollux-app-507503 ya existe — verificado contra la revisión que corre hoy
# (`gcloud run services describe pb-pollux ... --format="value(spec.template.spec.containers[0].image)"`
# devuelve `us-central1-docker.pkg.dev/pollux-app-507503/pollux-registry/pb-pollux:latest`,
# NO `durable-sky/pbs-registry` — ese es el del pb-leto legado).
#
# ⚠️ Antes del primer submit, mirá el tamaño del contexto que reporta gcloud: debe
# ser de pocos MB. Si informa ~100 MB, el .gcloudignore no está aplicando y se
# estarían subiendo Reference/ y demás documentos personales (nota (33)/(34)).
#
# `--substitutions=SHORT_SHA=...` no es opcional (mismo motivo que el runbook de Castor):
# sin él, $SHORT_SHA queda vacío y el tag correspondiente no se genera con sentido.
steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - Dockerfile.prod
      - -t
      - us-central1-docker.pkg.dev/pollux-app-507503/pollux-registry/pb-pollux:$SHORT_SHA
      - -t
      - us-central1-docker.pkg.dev/pollux-app-507503/pollux-registry/pb-pollux:latest
      - .

images:
  - us-central1-docker.pkg.dev/pollux-app-507503/pollux-registry/pb-pollux:$SHORT_SHA
  - us-central1-docker.pkg.dev/pollux-app-507503/pollux-registry/pb-pollux:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
